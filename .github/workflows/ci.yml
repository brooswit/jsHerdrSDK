name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install --frozen-lockfile
      - name: generated code matches schema
        run: bun run generate && bun run scripts/verify-generated-is-committed.ts
      - run: bun run typecheck
      - name: unit + load tests, coverage ≥ 90% lines and functions
        run: bun test test/unit test/load && bun run scripts/coverage/gate.ts
      - name: build
        run: bun run build
      # Live tests need a running herdr and are run locally before merge:
      #   HERDR_LIVE=1 bun test test/live

  parity:
    name: parity with latest herdr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install --frozen-lockfile
      - name: install latest herdr
        run: |
          export HERDR_INSTALL_DIR="$RUNNER_TEMP/herdr-bin"
          curl -fsSL https://herdr.dev/install.sh | sh
          echo "HERDR_BIN=$HERDR_INSTALL_DIR/herdr" >> "$GITHUB_ENV"
          "$HERDR_INSTALL_DIR/herdr" --version
      - name: SDK matches installed herdr (version, API inventory, wrapper coverage)
        run: bun run scripts/parity/check.ts

  release-gate:
    name: release gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: bun install --frozen-lockfile
      - run: bun run scripts/release/check.ts
        env: { RELEASE_BASE: "origin/${{ github.base_ref }}" }
